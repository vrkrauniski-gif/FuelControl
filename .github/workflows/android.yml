
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/signing/fuelcontrol.keystore"
          test -s "$HOME/signing/fuelcontrol.keystore"

      - name: Compilar APK assinada
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish FuelControl.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$HOME/signing/fuelcontrol.keystore" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelControl-APK
          path: bin/Release/net10.0-android/publish/*.apk
