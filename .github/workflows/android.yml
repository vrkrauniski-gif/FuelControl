name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        uses: actions/setup-dotnet@v4
        with:
       dotnet-version: '10.0.x'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Compilar APK
        run: dotnet publish FuelControl.csproj -c Release -f net10.0-android

      
    

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelControl-APK
          path: bin/Release/net10.0-android/publish/*.apk
