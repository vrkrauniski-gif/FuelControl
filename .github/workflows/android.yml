name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Compilar APK
        run: dotnet publish FuelControl.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Mostrar SHA-1 do APK
        run: |
          APK=$(find bin/Release/net9.0-android/publish -name '*Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find bin/Release/net9.0-android/publish -name '*.apk' | head -n 1)
          fi
          echo "Certificado do APK:"
          keytool -printcert -jarfile "$APK"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelControl-APK
          path: bin/Release/net9.0-android/publish/*.apk
