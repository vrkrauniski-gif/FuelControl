name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      
      - name: Compilar APK
        run: dotnet publish FuelControl.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelControl-APK
          path: bin/Release/net10.0-android/publish/*.apk
